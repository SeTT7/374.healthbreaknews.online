.site-shade {
  position: fixed;
  inset: 0;
  z-index: 1;
  background: rgba(10,30,18,.40);
}

.overlay {
  position: relative;
  z-index: 2;
  min-height: 100svh;
  display: grid;
  place-items: center;
  padding: calc(24px + env(safe-area-inset-top, 0px)) 16px calc(24px + env(safe-area-inset-bottom, 0px));
}

.modal {
  width: min(100%, 380px);
  border-radius: 16px;
  background: var(--card);
  box-shadow: 0 24px 70px rgba(0,0,0,.35);
  overflow: hidden;
  text-align: center;
  animation: pop .36s cubic-bezier(.2,.9,.3,1.15) both;
}

.modal-top {
  background: var(--accent);
  color: #fff;
  font-size: 12px;
  font-weight: 500;
  line-height: 1.4;
  padding: 10px 18px;
  text-wrap: balance;
}
.brand {
  font-family: Cinzel, Georgia, serif;
  font-weight: 600;
  font-size: 26px;
  letter-spacing: .08em;
  color: var(--accent);
  padding: 18px 16px 0;
}

.modal-body { padding: 16px 22px 22px; }

.icon {
  width: 54px;
  height: 54px;
  margin: 0 auto 14px;
  border-radius: 50%;
  display: grid;
  place-items: center;
  background: var(--soft);
  color: var(--accent);
}
.icon svg { width: 26px; height: 26px; }

.modal h1 { margin: 0 0 8px; font-size: 21px; font-weight: 700; line-height: 1.25; }
.modal h1 span { color: var(--accent); }
.modal .sub { margin: 0 0 20px; color: var(--muted); font-size: 14px; line-height: 1.55; }

/* caixa "Je ne suis pas un robot" */
.cb-row {
  display: flex;
  align-items: center;
  gap: 14px;
  padding: 13px 14px 13px 15px;
  border: 1px solid var(--line);
  border-radius: 10px;
  background: #f7f9f8;
  cursor: pointer;
  text-align: left;
  margin-bottom: 16px;
  transition: .18s border-color, .18s background;
  user-select: none;
  -webkit-user-select: none;
  -webkit-tap-highlight-color: transparent;
}
.cb-row:hover    { border-color: #b9c9bf; }
.cb-row.checking { pointer-events: none; }
.cb-row.checked  { border-color: rgba(29,107,65,.45); background: var(--soft); }

.cb-box {
  width: 26px;
  height: 26px;
  flex: 0 0 26px;
  border: 2px solid #b3bdb7;
  border-radius: 5px;
  display: grid;
  place-items: center;
  background: #fff;
  transition: .18s;
}
.cb-row.checking .cb-box { border-color: transparent; background: transparent; }
.cb-row.checked  .cb-box { border-color: var(--accent); background: var(--accent); }
.cb-box svg { width: 15px; height: 15px; }
